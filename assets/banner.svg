<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1a103c 100%); border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>

  <!-- Ambient Dynamic Floating Glow Orbs (Background only) -->
  <g opacity="0.6">
    <circle cx="150" cy="80" r="120" fill="#0284c7" filter="url(#blurFilter)">
      <animate attributeName="cy" values="80;120;80" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="150;190;150" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="220" r="140" fill="#7c3aed" filter="url(#blurFilter)">
      <animate attributeName="cy" values="220;170;220" dur="9s" repeatCount="indefinite" />
      <animate attributeName="cx" values="1050;1000;1050" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="280" r="100" fill="#ec4899" filter="url(#blurFilter)" opacity="0.3">
      <animate attributeName="cx" values="600;640;600" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Background Network Flow Lines (Subtle background layer) -->
  <g stroke="url(#glowGrad)" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 0,100 Q 300,160 600,100 T 1200,120">
      <animate attributeName="d" 
        values="M 0,100 Q 300,160 600,100 T 1200,120;
                M 0,120 Q 300,80 600,130 T 1200,90;
                M 0,100 Q 300,160 600,100 T 1200,120" 
        dur="14s" repeatCount="indefinite" />
    </path>
    <path d="M 0,240 Q 400,180 800,250 T 1200,210">
      <animate attributeName="d" 
        values="M 0,240 Q 400,180 800,250 T 1200,210;
                M 0,210 Q 400,270 800,190 T 1200,240;
                M 0,240 Q 400,180 800,250 T 1200,210" 
        dur="16s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Floating Stream Data Nodes (Background dynamics) -->
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="280" cy="115" r="3.5">
      <animate attributeName="cy" values="115;105;115" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="110" r="3.5">
      <animate attributeName="cy" values="110;120;110" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="235" r="4">
      <animate attributeName="cy" values="235;220;235" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="225" r="4">
      <animate attributeName="cy" values="225;240;225" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="5.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Border Frame -->
  <rect x="15" y="15" width="1170" height="310" rx="10" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="8,6" opacity="0.6"/>

  <!-- Top Category Indicator Pill (Foreground) -->
  <g transform="translate(600, 52)">
    <rect x="-175" y="0" width="350" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="-145" cy="15" r="4.5" fill="#10b981">
      <animate attributeName="fill" values="#10b981;#38bdf8;#10b981" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="-130" y="20" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Foreground Title (Crystal clear, high-contrast, fully visible) -->
  <text x="600" y="138" text-anchor="middle" fill="url(#textGrad)" font-size="38" font-weight="800" letter-spacing="-0.5">
    Awesome Web Utilities &amp; Content Aggregation
  </text>

  <!-- Foreground Subtitle (Crystal clear) -->
  <text x="600" y="178" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="500" letter-spacing="0.2">
    Next-Gen RSS Feed Readers • Read-It-Later Archivers • Visual Bookmarks • Web Clippers
  </text>

  <!-- Feature Tags / Metric Pills (Positioned safely below in the foreground) -->
  <g transform="translate(600, 240)">
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
      <text x="82.5" y="24" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">📡 RSS / Atom Feeds</text>
    </g>
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8"/>
      <text x="90" y="24" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">📚 Read-It-Later Queues</text>
    </g>
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8"/>
      <text x="90" y="24" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">🔖 Visual Bookmarking</text>
    </g>
    <g transform="translate(225, 0)">
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.8"/>
      <text x="82.5" y="24" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">⚡ Web Clippers &amp; OCR</text>
    </g>
  </g>
</svg>
